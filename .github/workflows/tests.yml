name: Tests

on:
  pull_request:
  push:
    branches: [perf/neon-traffic]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: All tests (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # CI uses isolated local storage and receives no production credentials.
      ALLEGRO_DATABASE_URL: ''
      DATABASE_URL: ''
      NEON_DATABASE_URL: ''
      ALLEGRO_DB_PATH: ${{ runner.temp }}/allegro-tests.sqlite3
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run all tests
        run: python -m pytest -q
